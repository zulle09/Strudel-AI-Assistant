<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page draw under the notch and home
     indicator, which is what makes the env(safe-area-inset-*) padding in
     the stylesheet do anything. -->
<meta name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strudel Assistant</title>
<meta name="description" content="Ask about Strudel functions and patterns, grounded in the documentation. Play every answer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"
  rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314100D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23F2A03D' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body>

<header class="rail">
  <div class="rail__brand">
    <span class="led" id="led" data-state="idle"></span>
    <span class="wordmark">Strudel<i>~</i><span>Assistant</span></span>
    <button class="btn btn--ghost rail__toggle" id="editorToggle" type="button"
      aria-expanded="false" aria-controls="editorPanel">Editor</button>
  </div>

  <!-- Signature element: one revolution of this lane is one Strudel cycle.
       Driven by the repl's own scheduler clock, not a guessed tempo. -->
  <div class="lane" id="lane" data-state="idle">
    <div class="lane__ticks" id="laneTicks"></div>
    <div class="lane__head" id="laneHead"></div>
  </div>

  <div class="rail__transport">
    <span class="readout" id="readout">cps —</span>
    <button class="btn btn--ghost" id="stopAll" type="button" disabled>Stop</button>
  </div>
</header>

<!-- Your own buffer, alongside the assistant's answers: the place to tweak a
     pattern it wrote, or to write one from scratch. -->
<aside class="editor-panel" id="editorPanel" aria-label="Pattern editor">
  <div class="editor-panel__head">
    <span class="micro">Editor</span>
    <span class="editor-panel__lamp" id="editorLamp" data-state="idle"></span>
    <button class="btn btn--ghost editor-panel__close" id="editorClose" type="button">Close</button>
  </div>

  <div class="editor">
    <pre class="editor__hl" id="editorHl" aria-hidden="true"><code></code></pre>
    <textarea id="editorInput" spellcheck="false" autocomplete="off"
      autocapitalize="off" autocorrect="off" aria-label="Strudel code"></textarea>
  </div>

  <!-- Strudel's draw helpers look for #test-canvas before creating their own.
       Providing it here gives pianoroll/punchcard/scope a visible home instead
       of a full-screen canvas buried under the interface. -->
  <div class="display" id="editorDisplay" hidden>
    <span class="micro display__label">Display</span>
    <canvas id="test-canvas" class="display__canvas"></canvas>
  </div>

  <div class="editor-panel__foot">
    <button class="btn btn--send" id="editorRun" type="button">Run</button>
    <button class="btn btn--ghost" id="editorStop" type="button" disabled>Stop</button>
    <span class="editor-panel__hint" id="editorHint"></span>
  </div>

  <!-- Drag to resize. Moves --editor-w, which the panel, the body offset and
       the composer all read, so both columns resize together. -->
  <div class="editor-panel__grip" id="editorGrip" role="separator"
    aria-orientation="vertical" aria-label="Editor width" tabindex="0"></div>
</aside>

<div class="editor-backdrop" id="editorBackdrop"></div>

<main class="feed" id="feed" aria-live="polite" aria-label="Conversation"></main>

<form class="composer" id="composer" autocomplete="off">
  <div class="composer__box">
    <textarea id="input" rows="1" spellcheck="false"
      placeholder="Ask about a function, or describe a pattern to build."
      aria-label="Your question"></textarea>
    <!-- data-state is what the stylesheet keys the dot and the label off, so
         it has to be present before any JS runs, not only once recording
         starts. -->
    <button class="btn btn--rec" id="rec" type="button" data-state="idle"
      aria-label="Hum a melody" title="Hum a melody and get it back as a pattern">
      <span class="rec__dot" aria-hidden="true"></span>
      <span class="rec__label" id="recLabel">Hum</span>
    </button>
    <button class="btn btn--send" id="send" type="submit">Ask</button>
  </div>
  <div class="composer__model">
    <label for="model">Model</label>
    <select id="model" aria-label="Chat model"></select>
  </div>
  <p class="composer__hint" id="composerHint">Enter sends &middot; Shift+Enter adds a line</p>
</form>

<script src="https://unpkg.com/@strudel/web@1.3.0"></script>
<script src="/static/app.js"></script>
</body>
</html>
